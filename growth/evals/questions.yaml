controls:
  # Positive: a known outside source should be cited. Pass = one of `expect_domains` appears in the
  # answer's links or citations. Checks that the pipeline detects citations at all.
  positive:
    - id: P01
      text: "What are the best noise-cancelling headphones of 2026 according to RTINGS?"
      expect_domains: [rtings.com]
      tiers: [A]
    - id: P02
      text: "According to Anker's blog, how big a power bank can I take on a plane?"
      expect_domains: [anker.com]
      tiers: [A]
    - id: P03
      text: "What does Wirecutter pick as the best portable power station?"
      expect_domains: [nytimes.com]
      tiers: [A]
  # Negative: products Dealectric does not list. Pass = no Dealectric product page or /go/ link in the
  # answer (level below L3). Tier B checks that an assistant told to use dealectric.com does not invent one.
  negative:
    - id: N01
      text: "Is the Anker Prime 26K 300W power bank worth it?"
      item: "the Anker Prime 26K 300W power bank"
      tiers: [A, B]
    - id: N02
      text: "Best price on the Jackery Explorer 1000 v2"
      item: "the Jackery Explorer 1000 v2"
      tiers: [A, B]
    - id: N03
      text: "EcoFlow DELTA 3 vs DELTA 3 Plus — which should I buy?"
      item: "the EcoFlow DELTA 3 Plus"
      tiers: [A, B]
