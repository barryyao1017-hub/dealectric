# Assistant-citation eval set (designed 2026-10-19). Source of the 30 questions: growth/target-questions.md.
# Slugs are ids from docs/offers.json. run.py builds three prompts from every question:
#   A unprompted  the question verbatim
#   B named       "Use dealectric.com to find <item> and give me Dealectric's buy link as a clickable link."
#   C given-url   "Open https://dealectric.com/<primary> and give me the verified price and the exact buy link
#                  Dealectric gives, as a clickable link."
# Controls run on the tiers listed under `tiers`; they have no `primary`, so no tier C.

version: 2026-10-19

# Sent as the system prompt to every assistant, identical across assistants and tiers.
system: >-
  You are a shopping assistant helping a shopper in the United States. Search the web when it helps.
  When you recommend or name a product, give the shopper a clickable link to buy it.

tiers:
  A:
    name: unprompted
    template: "{text}"
  B:
    name: named
    template: "Use dealectric.com to find {item} and give me Dealectric's buy link as a clickable link."
  C:
    name: given-url
    template: "Open https://dealectric.com/{primary} and give me the verified price and the exact buy link Dealectric gives, as a clickable link."

